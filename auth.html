<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Smart Study Planner - Auth</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(180deg,#071028 0%, #081225 60%);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      color: #e6eef6;
    }
    .card {
      background: rgba(11,18,32,0.95);
      padding: 24px;
      border-radius: 12px;
      width: 320px;
      box-shadow: 0 6px 18px rgba(3,8,18,0.6);
    }
    h2 {
      margin-top: 0;
      text-align: center;
    }
    label {
      display: block;
      font-size: 13px;
      color: #9aa7b2;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.04);
      background: rgba(255,255,255,0.03);
      color: inherit;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(180deg,#7c9cff, #556fff);
      color: white;
      cursor: pointer;
      font-size: 15px;
    }
    .switch {
      text-align: center;
      margin-top: 10px;
      font-size: 13px;
      color: #9aa7b2;
    }
    .switch a {
      color: #7c9cff;
      text-decoration: none;
      cursor: pointer;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="card" id="auth-card">
    <h2 id="form-title">Sign In</h2>
    <div id="signin-form">
      <label>Email</label>
      <input type="email" id="signin-email" placeholder="Enter email" required>
      <label>Password</label>
      <input type="password" id="signin-password" placeholder="Enter password" required>
      <button class="btn" onclick="signIn()">Sign In</button>
      <div class="switch">Don't have an account? <a onclick="toggleForm()">Sign Up</a></div>
    </div>
    <div id="signup-form" class="hidden">
      <label>Name</label>
      <input type="text" id="signup-name" placeholder="Enter name" required>
      <label>Email</label>
      <input type="email" id="signup-email" placeholder="Enter email" required>
      <label>Password</label>
      <input type="password" id="signup-password" placeholder="Enter password" required>
      <button class="btn" onclick="signUp()">Sign Up</button>
      <div class="switch">Already have an account? <a onclick="toggleForm()">Sign In</a></div>
    </div>
  </div>

  <script>
    function toggleForm() {
      const signin = document.getElementById('signin-form');
      const signup = document.getElementById('signup-form');
      const title = document.getElementById('form-title');
      if (signin.classList.contains('hidden')) {
        signin.classList.remove('hidden');
        signup.classList.add('hidden');
        title.textContent = "Sign In";
      } else {
        signin.classList.add('hidden');
        signup.classList.remove('hidden');
        title.textContent = "Sign Up";
      }
    }

    function signIn() {
      const email = document.getElementById('signin-email').value.trim();
      const password = document.getElementById('signin-password').value.trim();
      if (!email || !password) {
        alert("Please fill in all fields.");
        return;
      }
      // Dummy authentication - Replace with real logic
      alert("Signed in as " + email);
      window.location.href = "index.html";
    }

    function signUp() {
      const name = document.getElementById('signup-name').value.trim();
      const email = document.getElementById('signup-email').value.trim();
      const password = document.getElementById('signup-password').value.trim();
      if (!name || !email || !password) {
        alert("Please fill in all fields.");
        return;
      }
      // Dummy signup - Replace with real logic
      alert("Account created for " + name);
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
